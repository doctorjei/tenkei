# Gemet-side kernel config overlay
#
# Applied on top of Kata's fragments after upstream/kernel/build-kernel.sh
# completes the setup step. See scripts/build-kernel.sh for the merge_config
# invocation.
#
# Why this overlay exists: Kata's target use case (kata-agent over vsock)
# doesn't need userspace ACPI event delivery, so their fragments leave
# CONFIG_INPUT_EVDEV unset. Gemet's consumers (PVE qm shutdown, any host
# that sends an ACPI power-button press via QMP) need /dev/input/event*
# to exist so systemd-logind can react. Without this, `qm shutdown` hangs
# until forceStop kicks in.
#
# Keep this file minimal — only set what gemet specifically needs that
# Kata doesn't provide. Per-arch overlays live in sibling directories.

CONFIG_INPUT_EVDEV=y

# KVM host support (droste ask, 2026-06). Kata's guest kernel ships
# CONFIG_KVM_GUEST=y (paravirt-as-guest) but omits the host drivers that
# create /dev/kvm — their target is a guest, not a hypervisor host. Gemet's
# droste-stuffinator tier boots this kernel as a nested-virt PVE node
# (kento's pve-vm E2E mode), which needs the host half. CONFIG_KVM_GUEST
# stays set in Kata's fragments; host + guest together is the nested config.
#
# ALL BUILTIN (=y), not modules. gemet ships only vmlinuz + initramfs:
# kernel/Containerfile is `FROM scratch` + COPY of the two boot files, and
# scripts/build-kernel.sh has no `make modules_install` / no /lib/modules
# in any shipped artifact. A =m driver would compile but never reach a
# consumer, so modprobe would fail and /dev/kvm would still be absent.
# Builtin is the only form that reaches downstream. KVM_INTEL + KVM_AMD can
# both be =y; at runtime only the CPU-matching one initializes.
CONFIG_VIRTUALIZATION=y
CONFIG_KVM=y
CONFIG_KVM_INTEL=y
CONFIG_KVM_AMD=y

# Block drivers droste autoloads via /etc/modules-load.d/droste.conf (nbd,
# drbd) for its HA/storage tiers — silent no-ops on Kata's allnoconfig base.
# Builtin (=y) for the same no-modules-shipped reason above; the
# modules-load.d autoload then becomes a harmless no-op (driver already in
# the kernel). DRBD needs CONNECTOR (plus INET + PROC_FS, already enabled),
# so CONFIG_CONNECTOR is set explicitly to satisfy the dependency; the
# build-time overlay assertion in scripts/build-kernel.sh will fail the
# build if any of these are dropped by olddefconfig.
CONFIG_CONNECTOR=y
CONFIG_BLK_DEV_NBD=y
CONFIG_BLK_DEV_DRBD=y

# LSM: make AppArmor the active major MAC; leave SELinux compiled but dormant.
# Kata's common/lsm.conf compiles SELinux in (=y) with no explicit CONFIG_LSM,
# so the kernel-default LSM order puts selinux ahead of apparmor. The two are
# mutually exclusive "major" LSMs, so SELinux wins at boot, finds no policy
# (Debian ships none), and logs "SELinux: Could not open policy file" on every
# boot while AppArmor never initializes. Setting CONFIG_LSM with apparmor as the
# only major (selinux omitted) makes AppArmor the active MAC and silences
# SELinux without removing it: it stays re-enablable at boot via lsm=...,selinux
# or selinux=1 (CONFIG_SECURITY_SELINUX_BOOTPARAM=y is already set by Kata).
#
# AppArmor here is kernel-only and carries NO policies by design: yggdrasil
# strips the apparmor userspace (parser + profiles), so AppArmor loads inert and
# stays available-but-unconfined until a downstream reinstalls the apparmor
# package. CONFIG_AUDIT is set explicitly (AppArmor selects it anyway; making it
# explicit keeps it under the build-time overlay assertion in build-kernel.sh).
# AppArmor's other deps (SECURITY, NET, SECURITYFS, SECURITY_PATH,
# SECURITY_NETWORK) are already =y in Kata's fragments or auto-selected.
CONFIG_AUDIT=y
CONFIG_SECURITY_APPARMOR=y
CONFIG_LSM="landlock,lockdown,yama,loadpin,safesetid,integrity,apparmor"
