# Gemet-side kernel config overlay
#
# Applied on top of Kata's fragments after upstream/kernel/build-kernel.sh
# completes the setup step. See scripts/build-kernel.sh for the merge_config
# invocation.
#
# Why this overlay exists: Kata's target use case (kata-agent over vsock)
# doesn't need userspace ACPI event delivery, so their fragments leave
# CONFIG_INPUT_EVDEV unset. Gemet's consumers (PVE qm shutdown, any host
# that sends an ACPI power-button press via QMP) need /dev/input/event*
# to exist so systemd-logind can react. Without this, `qm shutdown` hangs
# until forceStop kicks in.
#
# Keep this file minimal — only set what gemet specifically needs that
# Kata doesn't provide. Per-arch overlays live in sibling directories.

CONFIG_INPUT_EVDEV=y

# KVM host support (droste ask, 2026-06). Kata's guest kernel ships
# CONFIG_KVM_GUEST=y (paravirt support for running AS a guest) but omits
# the host drivers that create /dev/kvm — their target is a guest, not a
# hypervisor host. Gemet's droste-stuffinator tier boots this kernel as a
# nested-virt PVE node (kento's pve-vm E2E mode), which needs the host
# half. CONFIG_KVM_GUEST stays set elsewhere in Kata's fragments; host +
# guest together is the nested config.
#
# KVM_INTEL/KVM_AMD are =m (not =y): the base gemet/boot image is a single
# artifact every consumer pulls, and the overwhelming majority of gemet VMs
# are guests that never touch /dev/kvm. Modules keep the base lean and load
# only on a virt-capable host (udev autoloads the CPU-appropriate one).
CONFIG_VIRTUALIZATION=y
CONFIG_KVM=y
CONFIG_KVM_INTEL=m
CONFIG_KVM_AMD=m

# Block drivers droste autoloads via /etc/modules-load.d/droste.conf (nbd,
# drbd) for its HA/storage tiers, but Kata's allnoconfig base omits them —
# the autoloads are silent no-ops today. =m so the existing autoload path
# works. NOTE: CONFIG_BLK_DEV_DRBD has dependencies (CONNECTOR, INET,
# lru_cache, PROC_FS); if the kernel build's merge_config step warns that
# DRBD was "requested but not set", its deps aren't satisfied in the merged
# config and this line needs either the missing deps added here or removal.
CONFIG_BLK_DEV_NBD=m
CONFIG_BLK_DEV_DRBD=m
